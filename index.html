<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Kumano Kodo Photo Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: map fills the left (top on phones); a "stop" panel follows the walk photo by photo, with a height profile and filmstrip. */
:root{
  --paper:#EEF1EB; --land:#F8F9F5; --sea:#D3DFE0; --coast:#A9B9B2;
  --ink:#1D2621; --muted:#5B6961; --rule:#CCD5CC; --cedar:#2E5A45;
  --shu:#C23F2B; --shu-soft:rgba(194,63,43,.14);
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121714; --land:#1B231F; --sea:#0D181B; --coast:#3A4A43;
  --ink:#E5EAE3; --muted:#97A59C; --rule:#2C3832; --cedar:#86B89C;
  --shu:#E8664E; --shu-soft:rgba(232,102,78,.18); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121714; --land:#1B231F; --sea:#0D181B; --coast:#3A4A43;
  --ink:#E5EAE3; --muted:#97A59C; --rule:#2C3832; --cedar:#86B89C;
  --shu:#E8664E; --shu-soft:rgba(232,102,78,.18); color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.app{display:grid;grid-template-columns:minmax(0,1fr) 420px;height:100%}
.mapwrap{position:relative;min-width:0;background:var(--sea);overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
#map.dragging{cursor:grabbing}
.panel{overflow-y:auto;border-left:1px solid var(--rule);display:flex;flex-direction:column;gap:20px;
  padding-block:24px 32px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

header h1{font-family:var(--display);font-weight:700;font-size:1.75rem;line-height:1.15;margin:0;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);font-size:.9rem}

.stop{display:flex;flex-direction:column;gap:12px}
.photo{position:relative;margin:0;border-radius:6px;overflow:hidden;background:var(--land);border:1px solid var(--rule);cursor:zoom-in}
.photo img{display:block;width:100%;max-height:48vh;object-fit:contain;background:var(--land)}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--cedar);font-weight:700;font-variant-numeric:tabular-nums}
.stop h2{font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.25;margin:2px 0 0;text-wrap:balance}
.stop p{margin:0;max-width:62ch}
.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}

.nav{display:flex;align-items:center;gap:10px}
.nav button{font:inherit;font-weight:500;border:1px solid var(--rule);background:var(--land);color:var(--ink);
  border-radius:999px;padding:8px 16px;cursor:pointer}
.nav button:hover:not(:disabled){border-color:var(--cedar)}
.nav button:disabled{opacity:.4;cursor:default}
.nav .count{margin-left:auto;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
button:focus-visible,.thumb:focus-visible,.photo:focus-visible{outline:2px solid var(--shu);outline-offset:2px}

.section-label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 6px}
.profile svg{width:100%;height:auto;display:block;overflow:visible}

.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.thumb{flex:0 0 auto;width:62px;height:62px;border-radius:5px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--land);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb[aria-current="true"]{border-color:var(--shu)}

.note{font-size:.78rem;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px;margin:0}

.mapctl{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:36px;height:36px;border-radius:8px;border:1px solid var(--rule);background:var(--land);color:var(--ink);font:500 18px/1 var(--body);cursor:pointer}
.legend{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:12px;background:var(--land);border:1px solid var(--rule);
  border-radius:6px;padding:6px 10px;font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.legend svg{flex:0 0 auto}

/* map text */
.town{font-family:var(--body);fill:var(--muted);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.sea-label{font-family:var(--display);fill:var(--coast);font-style:italic;letter-spacing:.2em}
.pin{cursor:pointer}
.pin circle{fill:var(--land);stroke:var(--ink)}
.pin text{fill:var(--ink);font-family:var(--body);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin.active circle{fill:var(--shu);stroke:var(--shu)}
.pin.active text{fill:#fff}
.halo{fill:var(--shu-soft)}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.92);display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}

@media (max-width:820px){
  .app{display:block;height:auto}
  .mapwrap{height:46vh;min-height:280px}
  .panel{border-left:0;overflow:visible}
  .photo img{max-height:62vh}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

</head>
<body>
<div class="app">
  <div class="mapwrap">
    <svg id="map" role="img" aria-label="Map of the walk on the Kii Peninsula with numbered photo locations"></svg>
    <div class="mapctl">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zall" aria-label="Show whole walk" title="Show whole walk">⤢</button>
    </div>
    <div class="legend">
      <svg width="34" height="8" aria-hidden="true"><line x1="0" y1="4" x2="34" y2="4" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/></svg>
      Line joins the photos in order, not the exact trail
    </div>
  </div>

  <aside class="panel">
    <header>
      <h1>Kumano Kodo</h1>
      <p>Five days on foot across the Kii Peninsula, 20–24 October 2026</p>
    </header>

    <section class="stop" aria-live="polite">
      <figure class="photo" id="photo" tabindex="0" aria-label="Open photo full size"><img id="photoImg" alt=""></figure>
      <div>
        <div class="eyebrow" id="when"></div>
        <h2 id="title"></h2>
      </div>
      <p id="caption"></p>
      <div class="meta"><span id="alt"></span><span id="coords"></span></div>
      <div class="nav">
        <button id="prev">← Previous</button>
        <button id="next">Next →</button>
        <span class="count" id="count"></span>
      </div>
    </section>

    <section class="profile">
      <p class="section-label">Height above sea level at each photo</p>
      <svg id="profile" viewBox="0 0 380 120" role="img" aria-label="Height of each photo above sea level across the five days"></svg>
    </section>

    <section>
      <p class="section-label">All photos</p>
      <div class="strip" id="strip"></div>
    </section>

    <p class="note">Photo locations and times come from the camera. Coastline © Natural Earth.</p>
  </aside>
</div>

<div class="lightbox" id="lightbox" hidden><img id="lbImg" alt=""></div>

  const minW=FIT.w/14,maxW=FIT.w*2.2;
  const w=Math.min(maxW,Math.max(minW,vb.w*f));const k=w/vb.w;
  vb={x:cx-(cx-vb.x)*k,y:cy-(cy-vb.y)*k,w,h:vb.h*k};apply();
}
function toMap(clientX,clientY){const r=svg.getBoundingClientRect();
  return [vb.x+(clientX-r.left)/r.width*vb.w, vb.y+(clientY-r.top)/r.height*vb.h];}

svg.addEventListener('wheel',e=>{e.preventDefault();const [mx,my]=toMap(e.clientX,e.clientY);zoomAt(Math.exp(e.deltaY*.0015),mx,my);},{passive:false});
const ptrs=new Map();let pinch=null,moved=0;
svg.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};}});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId);const cur={x:e.clientX,y:e.clientY};
  if(ptrs.size===1){const dx=cur.x-prev.x,dy=cur.y-prev.y;moved+=Math.abs(dx)+Math.abs(dy);
    if(moved>4){if(!svg.hasPointerCapture(e.pointerId))svg.setPointerCapture(e.pointerId);svg.classList.add('dragging');}
    const r=svg.getBoundingClientRect();vb.x-=dx*vb.w/r.width;vb.y-=dy*vb.h/r.height;apply();}
  ptrs.set(e.pointerId,cur);
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d2=Math.hypot(a.x-b.x,a.y-b.y);
    const [mx,my]=toMap((a.x+b.x)/2,(a.y+b.y)/2);zoomAt(pinch.d/d2,mx,my);pinch.d=d2;moved=99;}
});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;svg.classList.remove('dragging');};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
document.getElementById('zin').onclick=()=>zoomAt(1/1.6,vb.x+vb.w/2,vb.y+vb.h/2);
document.getElementById('zout').onclick=()=>zoomAt(1.6,vb.x+vb.w/2,vb.y+vb.h/2);
document.getElementById('zall').onclick=()=>setView(FIT,true);

// panel
const $=id=>document.getElementById(id);
const DAYNAMES=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const firstDay=STOPS[0].date;
function dayNum(s){return Math.round((Date.UTC(...s.date.split('-').map((v,i)=>i===1?v-1:+v))-Date.UTC(...firstDay.split('-').map((v,i)=>i===1?v-1:+v)))/864e5)+1;}
function whenText(s){const [y,m,d]=s.date.split('-').map(Number);const wd=new Date(Date.UTC(y,m-1,d)).getUTCDay();
  return `Day ${dayNum(s)} · ${DAYNAMES[wd]} ${d} ${MON[m-1]} · ${s.time}`;}

const strip=$('strip');
const thumbEls=STOPS.map((s,i)=>{const b=document.createElement('button');b.className='thumb';b.setAttribute('aria-label',`Photo ${i+1}: ${s.title}`);
  const im=document.createElement('img');im.src=s.thumb;im.alt="";im.loading="lazy";b.appendChild(im);b.onclick=()=>select(i,true);strip.appendChild(b);return b;});

// profile chart
const prof=$('profile');const PW=380,PH=120,PL=34,PR=8,PT=8,PB=22;
const tms=STOPS.map(s=>Date.parse(`${s.date}T${s.time}:00+09:00`));
const t0=Date.parse(`${firstDay}T00:00:00+09:00`),days=dayNum(STOPS[STOPS.length-1]),t1=t0+days*864e5;
const xs=t=>PL+(t-t0)/(t1-t0)*(PW-PL-PR), ymax=900, ys=a=>PT+(1-a/ymax)*(PH-PT-PB);
for(const v of [0,400,800]){el('line',{x1:PL,x2:PW-PR,y1:ys(v),y2:ys(v),stroke:"var(--rule)","stroke-width":1},prof);
  const t=el('text',{x:PL-6,y:ys(v),"text-anchor":"end","dominant-baseline":"central","font-size":9.5,fill:"var(--muted)","font-family":"var(--body)"},prof);t.textContent=v+" m";}
for(let k=0;k<days;k++){const x0=xs(t0+k*864e5),x1=xs(t0+(k+1)*864e5);
  if(k>0)el('line',{x1:x0,x2:x0,y1:PT,y2:PH-PB,stroke:"var(--rule)","stroke-width":1,"stroke-dasharray":"2 3"},prof);
  const t=el('text',{x:(x0+x1)/2,y:PH-6,"text-anchor":"middle","font-size":9.5,fill:"var(--muted)","font-family":"var(--body)"},prof);t.textContent="Day "+(k+1);}
const ppts=STOPS.map((s,i)=>[xs(tms[i]),ys(s.alt)]);
el('path',{d:`M${ppts[0][0]},${ys(0)}L${ppts.map(p=>p.join(",")).join("L")}L${ppts[ppts.length-1][0]},${ys(0)}Z`,fill:"var(--cedar)","fill-opacity":.12},prof);
el('polyline',{points:ppts.map(p=>p.join(",")).join(" "),fill:"none",stroke:"var(--cedar)","stroke-width":1.5},prof);
const profDots=ppts.map((p,i)=>{const c=el('circle',{cx:p[0],cy:p[1],r:4,fill:"var(--land)",stroke:"var(--cedar)","stroke-width":1.5,style:"cursor:pointer"},prof);
  c.addEventListener('click',()=>select(i,true));const tt=el('title',{},c);tt.textContent=`${i+1}. ${STOPS[i].title} (${STOPS[i].alt} m)`;return c;});

let cur=0;
function select(i,fly){
  cur=i;const s=STOPS[i];
  $('photoImg').src=s.photo;$('photoImg').alt=s.title;
  $('when').textContent=whenText(s);$('title').textContent=s.title;$('caption').textContent=s.caption;
  $('alt').textContent=`${s.alt} m above sea level`;
  $('coords').textContent=`${s.lat.toFixed(4)}° N, ${s.lon.toFixed(4)}° E`;
  $('count').textContent=`${i+1} of ${STOPS.length}`;
  $('prev').disabled=i===0;$('next').disabled=i===STOPS.length-1;
  pinEls.forEach((p,k)=>p.g.classList.toggle('active',k===i));
  gPins.appendChild(pinEls[i].g);
  halo.setAttribute('cx',pinEls[i].x);halo.setAttribute('cy',pinEls[i].y);
  thumbEls.forEach((b,k)=>b.setAttribute('aria-current',k===i?"true":"false"));
  thumbEls[i].scrollIntoView({block:"nearest",inline:"nearest"});
  profDots.forEach((c,k)=>{c.setAttribute('fill',k===i?"var(--shu)":"var(--land)");c.setAttribute('stroke',k===i?"var(--shu)":"var(--cedar)");c.setAttribute('r',k===i?5:4);});
  if(fly){const p=pinEls[i];
    const inside=p.x>vb.x+vb.w*.15&&p.x<vb.x+vb.w*.85&&p.y>vb.y+vb.h*.15&&p.y<vb.y+vb.h*.85;
    if(!inside)setView({x:p.x-vb.w/2,y:p.y-vb.h/2,w:vb.w,h:vb.h},true);}
  // preload neighbours
  [i-1,i+1].forEach(k=>{if(STOPS[k]){const im=new Image();im.src=STOPS[k].photo;}});
}
$('prev').onclick=()=>cur>0&&select(cur-1,true);
$('next').onclick=()=>cur<STOPS.length-1&&select(cur+1,true);
document.addEventListener('keydown',e=>{if(!$('lightbox').hidden){if(e.key==='Escape')$('lightbox').hidden=true;return;}
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();});
const openLb=()=>{$('lbImg').src=STOPS[cur].photo;$('lbImg').alt=STOPS[cur].title;$('lightbox').hidden=false;};
$('photo').onclick=openLb;$('photo').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLb();}};
$('lightbox').onclick=()=>{$('lightbox').hidden=true;};

function init(){FIT=fitView();vb={...FIT};apply();}
init();select(0,false);
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>{const old=FIT;FIT=fitView();
  const {W,H}=size();const cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;const h=vb.w*H/W;vb={x:cx-vb.w/2,y:cy-h/2,w:vb.w,h};apply();},60);}).observe(svg);
</script>

</body>
