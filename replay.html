<style>
/* Layout: full-screen 3D map; HUD top-left, controls along the bottom with a height profile that doubles as the scrubber.
   One deliberate dark look: the chrome sits over satellite imagery, so it stays dark in both OS themes. */
:root{
  --glass:rgba(14,20,17,.74); --glass-strong:rgba(14,20,17,.88); --line:rgba(255,255,255,.16);
  --ink:#F1F4EF; --muted:#B3BFB7; --shu:#E8664E;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0E1411;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
#map{position:fixed;inset:0}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px}

.glass{background:var(--glass);border:1px solid var(--line);border-radius:10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hud{position:fixed;z-index:3;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));
  max-width:min(460px,calc(100vw - 120px));padding:10px 14px}
.hud .day{font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.25;text-wrap:balance}
.hud .sub{color:var(--muted);font-size:.85rem;margin-top:2px;font-variant-numeric:tabular-nums}
.back{position:fixed;z-index:3;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));
  padding:8px 14px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500;font-size:.9rem}
.back:hover{border-color:rgba(255,255,255,.4)}
.maplibregl-ctrl-top-right{top:calc(52px + env(safe-area-inset-top,0px));right:env(safe-area-inset-right,0px)}

.bar{position:fixed;z-index:3;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;
  padding:28px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(to bottom,rgba(10,14,12,0),rgba(10,14,12,.78) 45%)}
.play{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:0;background:var(--shu);color:#fff;cursor:pointer;
  display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.play svg{width:22px;height:22px;fill:#fff}
.track{flex:1;min-width:0;position:relative;height:62px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.track svg{position:absolute;left:0;right:0;top:0;width:100%;height:44px;overflow:visible}
.daylabels{position:absolute;left:0;right:0;bottom:0;height:16px;font-size:.7rem;color:var(--muted);letter-spacing:.04em;pointer-events:none}
.daylabels span{position:absolute;top:0;padding-left:4px;white-space:nowrap}
.speed{flex:0 0 auto;min-width:46px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--glass);cursor:pointer;
  font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}

.card{position:fixed;z-index:3;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(98px + env(safe-area-inset-bottom,0px));
  display:flex;gap:12px;align-items:center;width:min(360px,calc(100vw - 24px));padding:8px;border-radius:12px;
  background:var(--glass-strong);border:1px solid var(--line);color:var(--ink);text-decoration:none;
  opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;pointer-events:none}
.card.show{opacity:1;transform:none;pointer-events:auto}
.card img{width:84px;height:84px;object-fit:cover;border-radius:8px;flex:0 0 auto;background:#222}
.card .cmeta{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.card .ctitle{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.25;margin-top:2px}
.card .clink{font-size:.78rem;color:var(--muted);margin-top:4px}
.card:hover .clink{color:var(--ink)}

.titlecard{position:fixed;z-index:2;left:50%;top:27%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
  opacity:0;transition:opacity .6s;width:min(90vw,700px);text-shadow:0 2px 18px rgba(0,0,0,.7),0 1px 3px rgba(0,0,0,.6)}
.titlecard.show{opacity:1}
.titlecard .n{font-size:.8rem;letter-spacing:.24em;text-transform:uppercase;font-weight:700}
.titlecard .t{font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,6vw,3.2rem);line-height:1.15;margin-top:4px;text-wrap:balance}

.start{position:fixed;z-index:4;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;width:min(90vw,420px)}
.start button{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:999px;border:0;background:var(--shu);color:#fff;
  font-weight:700;font-size:1.1rem;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.start button:disabled{opacity:.6;cursor:progress}
.start button svg{width:18px;height:18px;fill:#fff}
.start p{margin:0;padding:6px 12px;border-radius:8px;font-size:.85rem;color:var(--ink)}
.msg{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

@media (max-width:600px){
  .hud{padding:8px 12px}
  .hud .day{font-size:1.02rem}
  .card img{width:64px;height:64px}
  .card .ctitle{font-size:.98rem}
  .bar{gap:10px}
  .play{width:46px;height:46px}
}
@media (prefers-reduced-motion:reduce){.card,.titlecard{transition:none}}
</style>
</head>

tion": "Walking along the covered shopping street in town.", "lat": 33.627811, "lon": 135.942978, "alt": 5, "photo": "photos/IMG_2321.jpg", "thumb": "thumbs/IMG_2321.jpg"}, {"id": "IMG_2326", "date": "2026-10-23", "time": "18:51", "title": "Tuna dinner", "caption": "Fresh tuna being prepared at the counter in Katsuura, famous for its catch.", "lat": 33.626919, "lon": 135.949889, "alt": 12, "photo": "photos/IMG_2326.jpg", "thumb": "thumbs/IMG_2326.jpg"}, {"id": "IMG_2334", "date": "2026-10-24", "time": "08:42", "lat": 33.628369, "lon": 135.941406, "alt": 6, "title": "A kite in the rain", "caption": "A black kite on a power pole near Katsuura on the final morning.", "photo": "photos/IMG_2334.jpg", "thumb": "thumbs/IMG_2334.jpg"}];
const DAYS = ["Arrival in Tanabe", "Takijiri to Chikatsuyu", "Chikatsuyu to Hongū", "Kogumotori-goe to Koguchi", "Ogumotori-goe to Nachi and Katsuura", "Katsuura"];
const DAYCOL = ["#D2C1A8","#6FD3A0","#82BAF0","#C3A6EC","#F0C35F","#78D6D6"];

const rad=Math.PI/180;
const dUTC=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);};
const firstDay=STOPS[0].date;
const N=STOPS.length;
const P=STOPS.map(s=>[s.lon,s.lat]);
const TM=STOPS.map(s=>Date.parse(`${s.date}T${s.time}:00+09:00`));
const DAY=STOPS.map(s=>Math.round((dUTC(s.date)-dUTC(firstDay))/864e5)+1);
const hav=(a,b)=>{const dLat=(b[1]-a[1])*rad,dLon=(b[0]-a[0])*rad;
  const x=Math.sin(dLat/2)**2+Math.cos(a[1]*rad)*Math.cos(b[1]*rad)*Math.sin(dLon/2)**2;return 2*6371000*Math.asin(Math.sqrt(x));};
const brg=(a,b)=>{const y=Math.sin((b[0]-a[0])*rad)*Math.cos(b[1]*rad);
  const x=Math.cos(a[1]*rad)*Math.sin(b[1]*rad)-Math.sin(a[1]*rad)*Math.cos(b[1]*rad)*Math.cos((b[0]-a[0])*rad);return Math.atan2(y,x)/rad;};
const lerp=(a,b,u)=>a+(b-a)*u;
const lerpP=(a,b,u)=>[lerp(a[0],b[0],u),lerp(a[1],b[1],u)];
const angDiff=(a,b)=>((a-b)%360+540)%360-180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const $=id=>document.getElementById(id);

/* ---------- timeline ---------- */
// Walking legs move at a steady replay speed; rides and overnights become short fly-overs.
const SEG=[];let walkTotal=0;
for(let i=0;i<N-1;i++){
  const d=hav(P[i],P[i+1]);const hrs=Math.max((TM[i+1]-TM[i])/3.6e6,1/60);
  const type=DAY[i]!==DAY[i+1]?'night':(d>1500&&d/1000/hrs>7)?'ride':'walk';
  SEG.push({d,type});if(type==='walk')walkTotal+=d;
}
const WALK_SECONDS=130,DWELL=0.45,RIDE=2.8,NIGHT=3.6;
const V=walkTotal/WALK_SECONDS;
const TL=[];let T=0;
for(let i=0;i<N;i++){
  TL.push({k:'dwell',i,t0:T,t1:T+DWELL});T+=DWELL;
  if(i<N-1){const s=SEG[i];const dur=s.type==='walk'?Math.max(0.1,s.d/V):s.type==='ride'?RIDE:NIGHT;
    TL.push({k:'seg',i,type:s.type,t0:T,t1:T+dur});T+=dur;}
}
const TOTAL=T;
function find(t){let lo=0,hi=TL.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(TL[m].t0<=t)lo=m;else hi=m-1;}return TL[lo];}
function state(t){
  t=clamp(t,0,TOTAL);const e=find(t);const i=e.i;
  if(e.k==='dwell')return {e,i,u:0,pos:P[i],alt:STOPS[i].alt,clock:TM[i],day:DAY[i]};
  const u=clamp((t-e.t0)/(e.t1-e.t0),0,1);const uu=e.type==='walk'?u:u*u*(3-2*u);
  return {e,i,u,pos:lerpP(P[i],P[i+1],uu),alt:lerp(STOPS[i].alt,STOPS[i+1].alt,uu),
    clock:e.type==='walk'?lerp(TM[i],TM[i+1],u):null,day:(e.type==='night'&&u>0.5)?DAY[i+1]:DAY[i]};
}
function aheadPoint(i,u,L){
  let from=lerpP(P[i],P[i+1],u),rem=L,k=i;
  while(k<N-1&&SEG[k].type==='walk'){const to=P[k+1];const d=hav(from,to);
    if(d>=rem)return lerpP(from,to,rem/d);rem-=d;from=to;k++;}
  return from;
}

/* ---------- camera ---------- */
const baseZoom=()=>innerWidth<700?13.7:14.3;
function camFor(st){
  const Z=baseZoom(),e=st.e;let zoom=Z,pitch=62,target=null;
  const walkDir=(j,u)=>{if(j<N-1&&SEG[j].type==='walk'){const from=lerpP(P[j],P[j+1],u);const a=aheadPoint(j,u,450);if(hav(from,a)>15)return brg(from,a);}return null;};
  if(e.k==='dwell'||e.type==='walk'){
    target=walkDir(st.i,e.k==='dwell'?0:st.u);
    if(target==null&&st.i>0&&SEG[st.i-1].type==='walk'&&hav(P[st.i-1],P[st.i])>15)target=brg(P[st.i-1],P[st.i]);
  }else{
    const d=SEG[st.i].d,s=Math.sin(Math.PI*st.u),dip=clamp(Math.log2(Math.max(d,1)/1200),0,3.2);
    zoom=Z-dip*s;pitch=62-16*s;
    target=(st.u<0.55&&d>200)?brg(P[st.i],P[st.i+1]):walkDir(st.i+1,0);
  }
  return {center:st.pos,zoom,pitch,target};
}

/* ---------- formatting ---------- */
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const jst=ms=>new Date(ms+9*3600e3);
const fmtDate=ms=>{const d=jst(ms);return `${WD[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`;};
const fmtTime=ms=>{const d=jst(ms);return `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;};

/* ---------- height profile / scrubber ---------- */
const prof=$('prof'),NS="http://www.w3.org/2000/svg";
const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const PW=1000,PH=44,AMAX=950;
const px=t=>t/TOTAL*PW,py=a=>PH-2-clamp(a,0,AMAX)/AMAX*(PH-6);
let pd=`M0,${PH}`;for(const e of TL)pd+=`L${px(e.t0).toFixed(1)},${py(state(e.t0).alt).toFixed(1)}`;
pd+=`L${PW},${py(STOPS[N-1].alt).toFixed(1)}L${PW},${PH}Z`;
const defs=mk('defs',{},prof);const clip=mk('clipPath',{id:'done'},defs);const clipRect=mk('rect',{x:0,y:-10,width:0,height:PH+20},clip);
mk('path',{d:pd,fill:'rgba(255,255,255,.14)',stroke:'rgba(255,255,255,.45)','stroke-width':1,'vector-effect':'non-scaling-stroke'},prof);
mk('path',{d:pd,fill:'rgba(232,102,78,.45)',stroke:'#E8664E','stroke-width':1.5,'vector-effect':'non-scaling-stroke','clip-path':'url(#done)'},prof);
const dayStart={};TL.forEach(e=>{if(e.k==='dwell'&&dayStart[DAY[e.i]]==null)dayStart[DAY[e.i]]=e.t0;});
const days=Object.keys(dayStart).map(Number).sort((a,b)=>a-b);
days.forEach((d,k)=>{const x=px(dayStart[d]);
  if(k>0)mk('line',{x1:x,x2:x,y1:0,y2:PH,stroke:'rgba(255,255,255,.35)','stroke-width':1,'stroke-dasharray':'2 3','vector-effect':'non-scaling-stroke'},prof);
  const next=k<days.length-1?dayStart[days[k+1]]:TOTAL;
  if((next-dayStart[d])/TOTAL>0.07){const s=document.createElement('span');s.style.left=(x/PW*100)+'%';s.textContent='Day '+d;$('daylabels').appendChild(s);}
});
const head=mk('line',{x1:0,x2:0,y1:-4,y2:PH,stroke:'#fff','stroke-width':2,'vector-effect':'non-scaling-stroke'},prof);

/* ---------- map ---------- */
let map;
const bounds=P.reduce((b,p)=>[[Math.min(b[0][0],p[0]),Math.min(b[0][1],p[1])],[Math.max(b[1][0],p[0]),Math.max(b[1][1],p[1])]],[[180,90],[-180,-90]]);
const pad=()=>{const w=innerWidth,h=innerHeight;return {top:Math.min(120,h*.2),bottom:Math.min(130,h*.22),left:Math.min(50,w*.08),right:Math.min(50,w*.08)};};
const style={version:8,
  sources:{
    sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:18,
      attribution:'Imagery © <a href="https://www.esri.com/">Esri</a>, Maxar, Earthstar Geographics'},
    dem:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,maxzoom:14,encoding:'terrarium',
      attribution:'Terrain: <a href="https://registry.opendata.aws/terrain-tiles/">Mapzen / AWS Terrain Tiles</a>'},
    hs:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,maxzoom:14,encoding:'terrarium'}
  },
  layers:[
    {id:'bg',type:'background',paint:{'background-color':'#5E7466'}},
    {id:'sat',type:'raster',source:'sat',paint:{'raster-saturation':-0.1,'raster-contrast':0.06}},
    {id:'hill',type:'hillshade',source:'hs',paint:{'hillshade-exaggeration':0.3,'hillshade-shadow-color':'#0A1410','hillshade-highlight-color':'#FFFFFF','hillshade-accent-color':'#0A1410'}}
  ],
  terrain:{source:'dem',exaggeration:1.4}
};
try{
  map=new maplibregl.Map({container:'map',style,bounds,fitBoundsOptions:{padding:pad()},maxPitch:80,attributionControl:false,fadeDuration:200});
}catch(err){
  document.body.insertAdjacentHTML('beforeend','<div class="msg">This replay needs a browser with 3D graphics turned on. <a href="index.html" style="color:inherit">Open the photo map instead</a>.</div>');
  return;
}
map.addControl(new maplibregl.AttributionControl({compact:true}),'top-right');
map.on('error',e=>console.warn(e&&e.error?e.error.message:e));

const fc=f=>({type:'FeatureCollection',features:f});
function runs(pred,upto){const feats=[];let cur=null;
  for(let k=0;k<upto;k++){if(!pred(k)){cur=null;continue;}
    if(!cur||cur.properties.day!==DAY[k]){cur={type:'Feature',properties:{day:DAY[k]},geometry:{type:'LineString',coordinates:[P[k]]}};feats.push(cur);}
    cur.geometry.coordinates.push(P[k+1]);}
  return feats;}
const colorExpr=['match',['get','day']];DAYCOL.forEach((c,k)=>colorExpr.push(k+1,c));colorExpr.push('#FFFFFF');

map.on('load',()=>{
  if(map.setSky)map.setSky({'sky-color':'#8FB6D3','horizon-color':'#DCE6EA','fog-color':'#DCE6EA','sky-horizon-blend':0.6,'horizon-fog-blend':0.7,'fog-ground-blend':0.88,'atmosphere-blend':0});
  map.addSource('walkAll',{type:'geojson',data:fc(runs(k=>SEG[k].type==='walk',N-1))});
  map.addSource('moveAll',{type:'geojson',data:fc(SEG.map((s,k)=>s.type!=='walk'&&s.d>300?{type:'Feature',properties:{},geometry:{type:'LineString',coordinates:[P[k],P[k+1]]}}:null).filter(Boolean))});
  map.addSource('done',{type:'geojson',data:fc([])});
  map.addSource('stops',{type:'geojson',data:fc(STOPS.map((s,i)=>({type:'Feature',properties:{i,day:DAY[i]},geometry:{type:'Point',coordinates:P[i]}})))});
  map.addSource('dot',{type:'geojson',data:{type:'Feature',properties:{},geometry:{type:'Point',coordinates:P[0]}}});
  map.addLayer({id:'moveAll',type:'line',source:'moveAll',paint:{'line-color':'#FFFFFF','line-opacity':0.55,'line-width':1.6,'line-dasharray':[2,2]}});
  map.addLayer({id:'walkAll',type:'line',source:'walkAll',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#FFFFFF','line-opacity':0.5,'line-width':2.5}});
  map.addLayer({id:'doneCase',type:'line',source:'done',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#FFFFFF','line-width':7,'line-opacity':0.9}});
  map.addLayer({id:'done',type:'line',source:'done',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':colorExpr,'line-width':4}});
  map.addLayer({id:'stops',type:'circle',source:'stops',paint:{'circle-radius':3.2,'circle-color':'#FFFFFF','circle-opacity':0.85}});
  map.addLayer({id:'stopsPassed',type:'circle',source:'stops',filter:['<=',['get','i'],-1],paint:{'circle-radius':4.5,'circle-color':colorExpr,'circle-stroke-color':'#FFFFFF','circle-stroke-width':1.5}});
  map.addLayer({id:'dotHalo',type:'circle',source:'dot',paint:{'circle-radius':15,'circle-color':'#E8664E','circle-opacity':0.28}});
  map.addLayer({id:'dot',type:'circle',source:'dot',paint:{'circle-radius':7,'circle-color':'#E8664E','circle-stroke-color':'#FFFFFF','circle-stroke-width':2.5}});
  map.fitBounds(bounds,{padding:pad(),pitch:45,bearing:-12,duration:0});
  const at=document.querySelector('.maplibregl-ctrl-attrib');if(at){at.classList.remove('maplibregl-compact-show');at.removeAttribute('open');}
  ready=true;
  $('startBtn').disabled=false;$('startLabel').textContent='Play the walk';
});

/* ---------- playback ---------- */
let ready=false,t=0,playing=false,speed=1,camB=-12,lastFrame=null,blend=null,raf=null,lastI=-2,cardTimer=null;
const mins=Math.max(1,Math.round(TOTAL/60));
$('startHint').textContent=`About ${mins} minutes · ${N} photos pop up as you pass them`;

let doneCache={upto:-1,feats:[]};
function doneData(st){
  if(doneCache.upto!==st.i)doneCache={upto:st.i,feats:runs(k=>SEG[k].type==='walk',st.i)};
  let f=doneCache.feats;
  if(st.e.k==='seg'&&st.e.type==='walk')f=f.concat([{type:'Feature',properties:{day:DAY[st.i]},geometry:{type:'LineString',coordinates:[P[st.i],st.pos]}}]);
  return fc(f);
}
function showCard(i,sticky){
  const s=STOPS[i];$('cardImg').src=s.thumb;$('cardImg').alt=s.title;$('cardTitle').textContent=s.title;
  $('cardMeta').textContent=`Photo ${i+1} of ${N} · ${fmtTime(TM[i])}`;$('card').href='index.html#'+encodeURIComponent(s.id);
  $('card').classList.add('show');clearTimeout(cardTimer);
  if(!sticky)cardTimer=setTimeout(()=>{if(playing)$('card').classList.remove('show');},2800);
  for(let k=i+1;k<=Math.min(N-1,i+4);k++){const im=new Image();im.src=STOPS[k].thumb;}
}
let tcShown=null;
function title(day){
  if(day===tcShown)return;tcShown=day;
  if(day==null){$('titlecard').classList.remove('show');return;}
  $('tcN').textContent='Day '+day+' · '+fmtDate(TM[DAY.indexOf(day)]);
  $('tcT').textContent=DAYS[day-1]||'';$('titlecard').classList.add('show');
}
let hudKey='';
function hud(st){
  const dayTxt=`Day ${st.day} · ${DAYS[st.day-1]||''}`;
  let sub;
  if(st.e.k==='seg'&&st.e.type==='night')sub='Overnight';
  else if(st.e.k==='seg'&&st.e.type==='ride')sub=`${fmtDate(TM[st.i])} · Transfer`;
  else sub=`${fmtDate(st.clock)} · ${fmtTime(st.clock)} · ${Math.round(st.alt)} m`;
  const key=dayTxt+sub;if(key===hudKey)return;hudKey=key;
  $('hudDay').textContent=dayTxt;$('hudSub').textContent=sub;
}
function render(dt,smooth){
  if(!ready)return;
  const st=state(t),c=camFor(st);
  if(c.target!=null)camB=smooth?camB+angDiff(c.target,camB)*(1-Math.exp(-dt*1.5*Math.min(speed,2))):c.target;
  let cam={center:c.center,zoom:c.zoom,pitch:c.pitch,bearing:camB};
  if(blend){
    const k=clamp((performance.now()-blend.start)/blend.dur,0,1),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,f=blend.from;
    cam={center:lerpP(f.center,cam.center,e),zoom:lerp(f.zoom,cam.zoom,e),pitch:lerp(f.pitch,cam.pitch,e),bearing:f.bearing+angDiff(cam.bearing,f.bearing)*e};
    if(k>=1)blend=null;
  }
  map.jumpTo(cam);
  map.getSource('dot').setData({type:'Feature',properties:{},geometry:{type:'Point',coordinates:st.pos}});
  map.getSource('done').setData(doneData(st));
  if(st.i!==lastI){
    map.setFilter('stopsPassed',['<=',['get','i'],st.i]);
    if(playing&&st.e.k==='dwell')showCard(st.i,false);else if(!playing)showCard(st.i,true);
    lastI=st.i;
  }
  hud(st);
  title(st.e.k==='seg'&&st.e.type==='night'?DAY[st.i+1]:(t<2.2&&playing?DAY[0]:null));
  const x=px(t);clipRect.setAttribute('width',x);head.setAttribute('x1',x);head.setAttribute('x2',x);
  $('track').setAttribute('aria-valuenow',Math.round(t/TOTAL*100));
  $('track').setAttribute('aria-valuetext',`${$('hudDay').textContent}, ${$('hudSub').textContent}`);
}
function loop(now){
  if(!playing){raf=null;return;}
  const dt=lastFrame==null?0:Math.min(0.1,(now-lastFrame)/1000);lastFrame=now;
  if(!(blend&&blend.hold))t+=dt*speed;
  if(t>=TOTAL){t=TOTAL;render(dt,true);finish();return;}
  render(dt,true);raf=requestAnimationFrame(loop);
}
const ICON_PLAY='M7 4.5v15l13-7.5z',ICON_PAUSE='M6 4.5h4.5v15H6zM13.5 4.5H18v15h-4.5z',ICON_AGAIN='M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z';
function setIcon(d,label){$('playIcon').innerHTML=`<path d="${d}"/>`;$('play').setAttribute('aria-label',label);}
function play(){
  if(!ready)return;
  if(t>=TOTAL){t=0;lastI=-2;}
  $('start').hidden=true;
  const fresh=t===0;
  if(fresh){const c0=camFor(state(0));if(c0.target!=null)camB=c0.target;}
  const c=map.getCenter();
  blend={from:{center:[c.lng,c.lat],zoom:map.getZoom(),pitch:map.getPitch(),bearing:map.getBearing()},start:performance.now(),dur:fresh?2600:900,hold:fresh};
  playing=true;lastFrame=null;setIcon(ICON_PAUSE,'Pause');
  if(!raf)raf=requestAnimationFrame(loop);
}
function pause(){playing=false;setIcon(ICON_PLAY,'Play');if(raf){cancelAnimationFrame(raf);raf=null;}}
function finish(){
  pause();setIcon(ICON_AGAIN,'Replay from the start');title(null);
  setTimeout(()=>{if(!playing)map.fitBounds(bounds,{padding:pad(),pitch:45,bearing:-12,duration:3000});},1200);
}
$('play').onclick=()=>playing?pause():play();
$('startBtn').onclick=play;
const SPEEDS=[1,2,4];
$('speed').onclick=()=>{speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];$('speed').textContent=speed+'×';};

/* scrubbing */
const track=$('track');let dragging=false,wasPlaying=false;
function seekX(x){const r=track.getBoundingClientRect();t=clamp((x-r.left)/r.width,0,1)*TOTAL;blend=null;$('start').hidden=true;render(0,false);}
track.addEventListener('pointerdown',e=>{if(!ready)return;track.setPointerCapture(e.pointerId);dragging=true;wasPlaying=playing;if(playing)pause();seekX(e.clientX);});
track.addEventListener('pointermove',e=>{if(dragging)seekX(e.clientX);});
const endDrag=()=>{if(!dragging)return;dragging=false;if(wasPlaying&&t<TOTAL)play();};
track.addEventListener('pointerup',endDrag);track.addEventListener('pointercancel',endDrag);
track.addEventListener('keydown',e=>{
  if(!ready)return;const step={ArrowRight:5,ArrowLeft:-5,PageUp:30,PageDown:-30}[e.key];
  if(step!=null){e.preventDefault();t=clamp(t+step,0,TOTAL);blend=null;$('start').hidden=true;render(0,false);}
  else if(e.key==='Home'||e.key==='End'){e.preventDefault();t=e.key==='Home'?0:TOTAL;blend=null;render(0,false);}
});
document.addEventListener('keydown',e=>{if(e.key===' '&&!(e.target.closest&&e.target.closest('button,a'))){e.preventDefault();playing?pause():play();}});
addEventListener('resize',()=>{if(!playing&&ready&&$('start').hidden)render(0,false);});

// test hooks
window.__replay={seek:s=>{t=clamp(s,0,TOTAL);blend=null;$('start').hidden=true;render(0,false);},total:TOTAL,play,pause,get t(){return t;},get ready(){return ready;}};
})();
</script>
